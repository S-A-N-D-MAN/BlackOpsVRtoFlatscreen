// BlackOpsVR Patreon v0.1.0-beta.1: private VR profile defaults.
// Merge these seta values into the private runtime players/config.cfg while closed.
// Do not replace the user's full config, import machine identifiers, or execute this file in-game.
// Native command-line +set values are not configuration authority in the supported SP executable.

// Required R55 windowed stereo source: two 1920x2160 eyes in 3840x2160.
seta r_customMode "3840x2160"
seta r_fullscreen "0"
seta r_aaSamples "1"

// Tested stereo/cinematic rendering baseline; game preference menus may reset these.
seta r_aspectRatio "auto"
seta r_aaAlpha "dither (fast)"
seta r_allow_intz "1"
seta r_allow_null_rt "1"
seta r_depthPrepass "0"
seta r_distortion "0"
seta r_dof_enable "1"
seta r_fastSkin "0"
seta r_glow_allowed "1"
seta r_blur_allowed "1"
seta r_inGameVideo "1"
seta r_motionblur_enable "0"
seta r_motionblur_frameBased_enable "0"
seta r_multiGpu "0"
seta r_multithreaded_device "0"
seta r_use_driver_convergence "0"
seta r_zfeather "1"
seta sm_enable "1"
seta com_maxfps "0"
seta r_vsync "0"

// Keep interaction prompts, scope overlays and the helicopter reticle.
// The mod reapplies only the ordinary crosshair preference at its guarded native boundary.
seta cg_drawCrosshair "0"
seta cg_drawTurretCrosshair "1"
seta cg_drawBreathHint "1"
seta cg_drawMantleHint "1"
seta cg_descriptiveText "1"

// Unlock campaign mission selection without lowering earned progress.
seta mis_01 "20"

// Private verified foliage texture-filter setting.
seta r_texFilterMipMode "1"
